<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado del hogar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f1f5f2;--card:#fff;--ink:#16241d;--mute:#6b7b72;--line:#dbe4de;--acc:#0f766e;--acc-ink:#fff;--done:#9aa8a0}
@media (prefers-color-scheme:dark){:root{--bg:#101a15;--card:#18251e;--ink:#e8f0ea;--mute:#8fa297;--line:#26362d;--acc:#2dd4bf;--acc-ink:#04201b;--done:#5d7065}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1{font:700 28px 'Bricolage Grotesque',sans-serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 12px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.g{background:none;border:none;color:var(--mute);padding:6px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
form.add{display:grid;grid-template-columns:1fr 70px;gap:8px;margin-bottom:8px}
form.add select{grid-column:1}form.add button{grid-column:2}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.sug button{padding:5px 10px;font-size:14px;border-radius:99px;color:var(--mute)}
h2{font:700 15px 'Bricolage Grotesque',sans-serif;margin:20px 0 6px;color:var(--acc)}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.it .n{flex:1}.it .q{color:var(--mute);font-size:14px}
.it.d .n{text-decoration:line-through;color:var(--done)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
#auth{max-width:340px;margin:12vh auto 0;display:grid;gap:10px}
.err{color:#c2410c;font-size:14px;min-height:20px}
</style>
</head>
<body>
<main>
  <section id="auth" hidden>
    <h1>Mercado del hogar</h1>
    <p class="sub">Entra con tu cuenta.</p>
    <input id="email" type="email" placeholder="Correo" autocomplete="email">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="p" id="login">Entrar</button>
    <div class="err" id="err"></div>
  </section>

  <section id="app" hidden>
    <div class="bar"><h1>Mercado</h1><button class="g" id="logout">Salir</button></div>
    <p class="sub" id="count"></p>
    <form class="add" id="form">
      <input id="name" placeholder="¿Qué falta en casa?" required autocomplete="off" list="hist">
      <input id="qty" value="1" aria-label="Cantidad">
      <select id="cat"></select>
      <button class="p" type="submit">Añadir</button>
    </form>
    <datalist id="hist"></datalist>
    <div class="sug" id="sug"></div>
    <div id="list"></div>
    <button class="g" id="clear" hidden>Quitar comprados</button>
  </section>
</main>

<script>
// 1) Pega aquí los datos de TU NUEVO proyecto (Settings > API)
const SUPABASE_URL = 'https://dmtszolcshuicjxscbsb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r3AE0is_p-8mO9_d3VR9vg_zyNkapbi';

const CATS = ['Frutas y verduras','Carnes y pescado','Lácteos y huevos','Despensa','Aseo y hogar','Bebidas','Otros'];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let items = [], channel;

$('cat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');

async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  show(!!session);
  if(session) start();
}
function show(on){ $('app').hidden = !on; $('auth').hidden = on; }

$('login').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pass').value });
  if(error){ $('err').textContent = 'Correo o contraseña incorrectos.'; return; }
  show(true); start();
};
$('logout').onclick = async () => { await db.auth.signOut(); if(channel) db.removeChannel(channel); show(false); };

async function start(){
  await load();
  if(channel) db.removeChannel(channel);
  channel = db.channel('items').on('postgres_changes', { event:'*', schema:'public', table:'items' }, load).subscribe();
}

async function load(){
  const { data, error } = await db.from('items').select('*').order('created_at');
  if(error){ $('list').innerHTML = `<div class="empty">No se pudo cargar: ${error.message}</div>`; return; }
  items = data; render();
}

function render(){
  const pend = items.filter(i => !i.done), done = items.filter(i => i.done);
  $('count').textContent = pend.length ? `${pend.length} por comprar` : 'Todo comprado';
  let html = '';
  CATS.forEach(c => {
    const g = pend.filter(i => i.category === c);
    if(g.length) html += `<h2>${c}</h2>` + g.map(row).join('');
  });
  if(done.length) html += `<h2>En el carrito</h2>` + done.map(row).join('');
  $('list').innerHTML = html || '<div class="empty">La lista está vacía. Añade lo primero que falte.</div>';
  $('clear').hidden = !done.length;
  // historial para autocompletar y sugerencias rápidas
  const names = [...new Set(items.map(i => i.name))];
  $('hist').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  const inList = new Set(pend.map(i => i.name.toLowerCase()));
  $('sug').innerHTML = done.filter(i => !inList.has(i.name.toLowerCase())).slice(0,6)
    .map(i => `<button data-re="${i.id}">+ ${esc(i.name)}</button>`).join('');
}
const esc = s => s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const row = i => `<div class="it ${i.done?'d':''}">
  <input type="checkbox" data-t="${i.id}" ${i.done?'checked':''} aria-label="Marcar ${esc(i.name)}">
  <span class="n">${esc(i.name)} <span class="q">× ${esc(i.qty)}</span></span>
  <button class="g" data-x="${i.id}" aria-label="Eliminar ${esc(i.name)}">✕</button></div>`;

$('form').onsubmit = async e => {
  e.preventDefault();
  const name = $('name').value.trim(); if(!name) return;
  await db.from('items').insert({ name, qty:$('qty').value || '1', category:$('cat').value });
  $('name').value = ''; $('qty').value = '1'; $('name').focus();
};
$('list').onclick = async e => {
  const t = e.target.dataset;
  if(t.t) await db.from('items').update({ done:e.target.checked }).eq('id', t.t);
  if(t.x) await db.from('items').delete().eq('id', t.x);
};
$('sug').onclick = async e => {
  const it = items.find(i => i.id === e.target.dataset.re); if(!it) return;
  await db.from('items').insert({ name:it.name, qty:it.qty, category:it.category });
};
$('clear').onclick = () => db.from('items').delete().eq('done', true);

boot();
</script>
</body>
</html>
